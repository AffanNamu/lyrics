name: Validate Lyrics Studio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check modules, offline app shell and absence of remote URLs
        run: node scripts/check.mjs
      - name: Shared sync fixtures, lyric formats and vocal detector tests
        run: node --test tests/*.test.mjs
