name: Build native LYRICS Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host project
        working-directory: mobile
        run: flutter create --platforms=android --org com.lyricsstudio .
      - name: Set Android minimum SDK for FFmpeg
        working-directory: mobile
        run: sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
      - name: Install packages
        working-directory: mobile
        run: flutter pub get
      - name: Static analysis
        working-directory: mobile
        run: flutter analyze
      - name: Tests
        working-directory: mobile
        run: flutter test
      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: lyrics-native-android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
