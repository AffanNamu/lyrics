name: lyrics_studio
description: Offline-first native Android lyric video studio.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.10
  just_audio: ^0.10.5
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  ffmpeg_kit_flutter_new: ^4.6.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/models/vocal-yamnet-int8.bin
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins-latin-800-normal.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/inter-latin-600-normal.ttf
          weight: 600
    - family: Anton
      fonts:
        - asset: assets/fonts/anton-latin-400-normal.ttf
    - family: Bebas Neue
      fonts:
        - asset: assets/fonts/bebas-neue-latin-400-normal.ttf
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/space-grotesk-latin-700-normal.ttf
          weight: 700
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/playfair-display-latin-700-normal.ttf
          weight: 700
    - family: Pacifico
      fonts:
        - asset: assets/fonts/pacifico-latin-400-normal.ttf
